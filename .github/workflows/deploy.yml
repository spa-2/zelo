name: Deploy
on:
  push:
    branches:
      - dev
    paths-ignore:
      - 'terraform/**'
      - '**.md'

# 배포가 겹치면 진행 중인 배포는 끝까지 두고, 기다리는 배포는 가장 최근 하나만 남긴다
# (cancel-in-progress를 켜면 서버 교체가 중간에 끊겨 태그와 서버 상태가 어긋날 수 있다)
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write # AWS OIDC 로그인용
  contents: read

jobs:
  deploy:
    name: Build image and deploy
    # 저장소 변수 DEPLOY_ENABLED가 true일 때만 배포한다 (인프라를 내려 둔 동안 실패 알림이 쌓이지 않게)
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: zelo
      ASG_NAME: zelo-dev-app-asg
      IMAGE_TAG_PARAMETER: /zelo/dev/deploy/image_tag

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@aded0d722166a37980e030aa969dda0bfe6b6947 # v2.1.7

      # 서버가 ARM이라 arm64 이미지를 만든다. 실행 이미지 단계의 짧은 명령만 에뮬레이션된다
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Define image tag
        id: tag
        run: echo "value=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: . # 도커 파일을 빌드에서 사용
          platforms: linux/arm64 # 최종 이미지
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # 태그를 바꾸고 ASG에게 서버 교체를 시킨다. 새 서버는 부팅할 때 이 태그의 이미지를 실행한다
      - name: Deploy (instance refresh)
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          PREVIOUS=$(aws ssm get-parameter --name "$IMAGE_TAG_PARAMETER" --query Parameter.Value --output text)

          rollback_tag() {
            echo "image_tag를 이전 값($PREVIOUS)으로 되돌린다"
            aws ssm put-parameter --name "$IMAGE_TAG_PARAMETER" --type String --overwrite --value "$PREVIOUS"
          }

          aws ssm put-parameter --name "$IMAGE_TAG_PARAMETER" --type String --overwrite --value "$TAG"

          # Terraform의 instance_refresh 설정은 이 호출에 적용되지 않으므로 옵션을 직접 넘긴다
          if ! REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{"MinHealthyPercentage":100,"MaxHealthyPercentage":200,"InstanceWarmup":300}' \
            --query InstanceRefreshId --output text); then
            rollback_tag
            exit 1
          fi
          echo "instance refresh 시작: $REFRESH_ID"

          # 새 서버가 부팅하고 헬스체크를 통과해 옛 서버가 내려갈 때까지 기다린다 (최대 30분)
          for _ in $(seq 1 90); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].Status' --output text)
            echo "status: $STATUS"
            case "$STATUS" in
              Successful)
                echo "배포 완료: $TAG"
                exit 0
                ;;
              Failed|Cancelled|RollbackFailed|RollbackSuccessful)
                rollback_tag
                exit 1
                ;;
            esac
            sleep 20
          done

          echo "시간 초과"
          rollback_tag
          exit 1