name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    # 테스트 전에 PostgreSQL 컨테이너를 같이 띄움
    services:
      postgres:
        image: postgres:16            # 로컬에서 쓰는 버전과 맞추기
        env:
          POSTGRES_DB: zelotest
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres1234
        ports:
          - 5432:5432                 # runner의 localhost:5432 로 접근 가능
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # application.yml 값을 환경변수로 덮어씀 (Spring이 자동으로 매핑)
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/zelotest
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres1234
          # ${OPENAI_API_KEY} 가 비어 있으면 애플리케이션이 뜨지 않으므로 값을 넣어줌
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'dummy-key-for-ci' }}
          # application.yaml의 ${jwt_secret}에 매핑됨 (Base64, 32바이트 이상)
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'Y2ktZHVtbXktand0LXNlY3JldC1rZXktMzJieXRlcy1sb25nISE=' }}
        run: ./gradlew build sonar --info