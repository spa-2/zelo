plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id "org.sonarqube" version "7.5.0.8588"
}

group = 'com.server'
version = '0.0.1-SNAPSHOT'
description = 'zelo'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sonar {
    properties {
        property "sonar.projectKey", "spa-2_zelo"
        property "sonar.organization", "spa-2"
        // 소나큐브 위치
        property "sonar.host.url", "https://sonarcloud.io"
        // JaCoCo 리포트 위치
        property "sonar.coverage.jacoco.xmlReportPaths",
                "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
        // 테스트 코드 제외
        property "sonar.coverage.exclusions",
                "**/*Application.java,**/common/**,**/global/**"
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "io.awspring.cloud:spring-cloud-aws-dependencies:4.0.2"
    }
}

dependencies {
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.1')
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    // LLM 장애 대응. Boot 스타터는 Boot 4.0 기준이라 버전 호환 문제를 피하려고 코어 모듈만 직접 조립한다
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.4.0'
    implementation 'io.github.resilience4j:resilience4j-retry:2.4.0'
    implementation 'io.github.resilience4j:resilience4j-timelimiter:2.4.0'
    // 위 부품의 서킷 상태·재시도·시간 초과를 Micrometer 지표로 내보낸다
    implementation 'io.github.resilience4j:resilience4j-micrometer:2.4.0'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // redis, redission
    implementation 'org.redisson:redisson-spring-boot-starter:4.7.0'

    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // 포트원 웹훅 서명 검증
    implementation 'io.portone:server-sdk:0.24.0'


    // Encryption & Token
    implementation 'at.favre.lib:bcrypt:0.10.2'
    compileOnly "io.jsonwebtoken:jjwt-api:0.12.6"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:0.12.6"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:0.12.6"
    testImplementation "io.jsonwebtoken:jjwt-api:0.12.6"

    // Actuator & Prometheus
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    // 요청마다 traceId를 만들어 로그(MDC)에 찍고, 스레드가 바뀌어도 이어지게 한다
    implementation 'org.springframework.boot:spring-boot-micrometer-tracing-brave'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'

    // aws SSM
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-parameter-store'
    // ses
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-ses'
}

tasks.named('test') {
    useJUnitPlatform()
    //  테스트 끝나면 리포트 생성
    finalizedBy tasks.named('jacocoTestReport')
}

// JaCoCo 리포트 설정
tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        // SonarQube가 읽는 형식
        xml.required = true
        // 로컬에서 사람이 보는 용도 (build/reports/jacoco/test/html/index.html)
        html.required = true
    }
}

// sonar 실행 전에 리포트가 반드시 만들어지도록 설정
tasks.named('sonar') {
    dependsOn tasks.named('jacocoTestReport')
}