plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id "org.sonarqube" version "7.5.0.8588"
}

group = 'com.server'
version = '0.0.1-SNAPSHOT'
description = 'zelo'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sonar {
    properties {
        property "sonar.projectKey", "spa-2_zelo"
        property "sonar.organization", "spa-2"
        // 소나큐브 위치
        property "sonar.host.url", "https://sonarcloud.io"
        // JaCoCo 리포트 위치
        property "sonar.coverage.jacoco.xmlReportPaths",
                "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
        // 테스트 코드 제외
        property "sonar.coverage.exclusions",
                "**/*Application.java,**/common/**,**/global/**"
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.1')
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // redis, redission
    implementation 'org.redisson:redisson-spring-boot-starter:4.7.0'

    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Encryption & Token
    implementation 'at.favre.lib:bcrypt:0.10.2'
    compileOnly "io.jsonwebtoken:jjwt-api:0.12.6"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:0.12.6"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:0.12.6"
    testImplementation "io.jsonwebtoken:jjwt-api:0.12.6"
}

tasks.named('test') {
    useJUnitPlatform()
    //  테스트 끝나면 리포트 생성
    finalizedBy tasks.named('jacocoTestReport')
}

// JaCoCo 리포트 설정
tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        // SonarQube가 읽는 형식
        xml.required = true
        // 로컬에서 사람이 보는 용도 (build/reports/jacoco/test/html/index.html)
        html.required = true
    }
}

// sonar 실행 전에 리포트가 반드시 만들어지도록 설정
tasks.named('sonar') {
    dependsOn tasks.named('jacocoTestReport')
}