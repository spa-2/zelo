spring:
  application:
    name: zelo

  cloud:
    aws:
      region:
        static: ap-northeast-2 # ssm 리전

  datasource:
    url: jdbc:postgresql://localhost:5432/zelotest
    username: postgres
    password: postgres1234
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: public
        jdbc:
          time_zone: Asia/Seoul

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      # 재시도는 ResilientLlmGateway가 직접 제어하므로 클라이언트 기본값(3회)을 끈다
      max-retries: 0
      # 실제 요청 타임아웃은 SpringAiLlmGateway가 zelo.llm.timeout으로 요청마다 넣는다. 클라이언트 기본값도 같은 값으로 맞춘다
      timeout: ${zelo.llm.timeout}
      chat:
        # 메뉴 계획 실측에서 정확도·속도·비용이 가장 좋았던 조합. 단 gpt-6-luna는 Chat Completions에서 툴 호출을 추론 none일 때만 지원한다
        model: gpt-6-luna
        reasoning-effort: low

zelo:
  llm:
    mode: real
    # LLM 요청 하나를 기다리는 최대 시간. 실측에서 gpt-6-luna(low) 메뉴 계획 p95가 7.5초라 1.5배로 두었다 (팀 합의 후 조정)
    timeout: 12s
    # 리뷰 요약만 다른 모델로 보낸다. 지금 프롬프트("소수 의견은 빼라")를 gpt-6-luna는 잘 지키지 못해서(원문 재채점 68% vs 88%) 기존 모델을 유지한다.
    # 위 spring.ai.openai.chat.reasoning-effort(low)가 모든 요청에 섞이므로 gpt-5-mini의 기본값(medium)을 직접 적는다
    review-summary:
      model: gpt-5-mini
      reasoning-effort: medium
    retry:
     # 첫 시도를 포함한 총 시도 횟수(재시도 1회). 최악의 경우 고정 문구까지 timeout × 2 + wait-duration
     max-attempts: 2
     wait-duration: 500ms
    circuit-breaker:
      # 트래픽이 적어도 판단할 수 있도록 시간이 아닌 최근 시도 횟수로 실패율을 본다
      sliding-window-size: 10
      # 시도가 이만큼 쌓이기 전에는 열지 않는다. 메시지 하나가 재시도까지 실패하면 2번으로 세므로 약 3개 연속 실패에 열린다
      minimum-number-of-calls: 5
      failure-rate-threshold: 50
      wait-duration-in-open-state: 30s
    # 반쯤 열린 상태에서 시험 삼아 보내 볼 호출 수. 한 번의 우연한 성공으로 닫혔다 다시 열리는 것을 줄인다
      permitted-number-of-calls-in-half-open-state: 3

  hash:
    algorithm: SHA-256 # redis 와 같은 값 저장 시 사용 할 해쉬값

  portone:
    # real: 실제 포트원 호출, fake: MockPortOneClient (포트원 키 없이 로컬에서 돌릴 때)
    mode: ${PORTONE_MODE:fake}
    base-url: https://api.portone.io
    api-secret: ${PORTONE_API_SECRET:}
    store-id: ${PORTONE_STORE_ID:}
    webhook-secret: ${PORTONE_WEBHOOK_SECRET:}
    connect-timeout: 3s
    read-timeout: 5s
    time-zone: Asia/Seoul

  delivery:
    scheduler:
      enabled: true
      fixed-delay: 60000
    ship-after: 10m
    complete-after: 30m

  social:
    mode: real
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
      connect-timeout: 3s
      read-timeout: 5s

logging:
  level:
    # SimpleLoggerAdvisor가 LLM 요청·응답을 DEBUG로 남기므로 이 클래스만 연다
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

jwt:
  access-expiration: 600000 # 10분
  refresh-expiration: 1209600000 # 2주
  secret: ${jwt_secret}

server:
  port: 8080 # 서버 포트 명시
  tomcat:
    mbeanregistry: # 서버의 상태와 동작 정보 활성화
      enabled: true

management:
  server:
    port: 9292
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: zelo   # 모든 지표에 앱 이름 태그

info:
  app:
    name: zelo
    version: 1.0.0